name: Native Android prerelease

# Builds the native Kotlin app in android-native/ and publishes a GitHub prerelease.
# Runs only for the `kotlin` branch (or manually) and never on the upstream repository.

on:
  push:
    branches: [ "kotlin" ]
    paths:
      - "android-native/**"
      - ".github/workflows/native_android_prerelease.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'louisthecat86/Einundzwanzig-Meetup-App'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android-native

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          PREVIEW_KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          PREVIEW_KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            echo "$PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.jks"
            {
              echo "PREVIEW_STORE_FILE=$RUNNER_TEMP/preview.jks"
              echo "PREVIEW_STORE_PASSWORD=$PREVIEW_KEYSTORE_PASSWORD"
              echo "PREVIEW_KEY_ALIAS=$PREVIEW_KEY_ALIAS"
              echo "PREVIEW_KEY_PASSWORD=$PREVIEW_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using preview key from repository secrets."
          else
            echo "No PREVIEW_KEYSTORE_BASE64 secret: using the committed test-only preview key."
          fi

      - name: Unit tests
        run: ./gradlew --no-configuration-cache testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-configuration-cache :app:lintPreview

      - name: Build preview APK
        run: ./gradlew --no-configuration-cache :app:assemblePreview

      - name: Collect artifacts
        id: collect
        run: |
          VERSION=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          TAG="native-v${VERSION}-preview.${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp app/build/outputs/apk/preview/app-preview.apk "out/einundzwanzig-native-${VERSION}-preview.${GITHUB_RUN_NUMBER}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            android-native/**/build/reports/tests/
            android-native/app/build/reports/lint-results-preview.html
          if-no-files-found: ignore

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: Native Android ${{ steps.collect.outputs.version }} preview ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Test build of the native Kotlin/Compose app (`android-native/`), commit ${{ github.sha }}.

            - Package `space.einundzwanzig.meetup.preview`: installs next to the Flutter app and does not touch its data.
            - Signed with a test-only preview key. Not for production use.
          files: |
            android-native/out/*.apk
            android-native/out/SHA256SUMS.txt
